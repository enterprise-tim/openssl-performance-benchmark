name: OpenSSL Performance Benchmark

on:
  push:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Generate version matrix
      id: set-matrix
      run: |
        echo "🔍 Reading OpenSSL versions from config..."
        # Extract the versions array and format it for the matrix
        # We need the output to be JSON: { "include": [...] }
        MATRIX_JSON=$(jq -c '{include: .versions}' config/versions.json)
        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
        echo "🎯 Generated matrix: $MATRIX_JSON"

  benchmark:
    runs-on: ubuntu-latest-4-cores
    needs: generate-matrix
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Benchmark Image
      run: |
        echo "📦 Building image for OpenSSL ${{ matrix.version }}"
        docker build -t openssl-bench:${{ matrix.version }} \
          --build-arg OPENSSL_VERSION=${{ matrix.version }} \
          --build-arg OPENSSL_URL=${{ matrix.url }} \
          -f docker/Dockerfile .
    
    - name: Run Benchmark
      id: run_bench
      run: |
        echo "🏃 Running benchmark..."
        mkdir -p results
        
        # Run docker and capture output
        OUTPUT=$(docker run --rm openssl-bench:${{ matrix.version }})
        
        # Save output to file
        echo "$OUTPUT" > results/result-${{ matrix.version }}.json
        
        # Validate JSON
        if jq -e . results/result-${{ matrix.version }}.json >/dev/null 2>&1; then
          echo "✅ JSON result is valid"
        else
          echo "❌ Invalid JSON output:"
          echo "$OUTPUT"
          exit 1
        fi
        
        # Add metadata (like the node script does)
        # We use jq to add the 'config' object from the matrix
        TMP_FILE=$(mktemp)
        jq --argjson config '${{ toJson(matrix) }}' \
           --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
           '.config = $config | .timestamp = $timestamp' \
           results/result-${{ matrix.version }}.json > "$TMP_FILE"
        mv "$TMP_FILE" results/result-${{ matrix.version }}.json

    - name: Upload Benchmark Result
      uses: actions/upload-artifact@v4
      with:
        name: result-${{ matrix.version }}
        path: results/result-${{ matrix.version }}.json
        retention-days: 7

  report:
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
    
    - name: Download All Results
      uses: actions/download-artifact@v4
      with:
        path: downloaded-results
        pattern: result-*
        merge-multiple: true
        
    - name: Aggregate Results
      run: |
        mkdir -p results
        echo "🔍 Aggregating results from $(ls downloaded-results/result-*.json | wc -l) files..."
        
        # Merge individual result objects into a single array
        jq -s '.' downloaded-results/result-*.json > results/summary.json
        
        echo "✅ Created results/summary.json"
        ls -l results/summary.json
        
    - name: Generate Reports
      run: |
        echo "📊 Generating Markdown Report..."
        npm run generate-report
        
        echo "📈 Generating Visualizations..."
        npm run generate-viz
        
    - name: Prepare Release Artifacts
      run: |
        mkdir -p release-pack
        cp results/REPORT.md release-pack/
        cp results/visualizations.html release-pack/
        cp results/summary.json release-pack/
        
        # Create a compressed archive
        tar -czf benchmark-report.tar.gz -C release-pack .
        
    - name: Upload Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: release-pack/
        
    - name: Create Release
      id: create_release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: benchmark-${{ github.run_id }}
        release_name: "Benchmark Run ${{ github.run_id }}"
        body: |
          Automated benchmark run.
          
          See attached `REPORT.md` and `visualizations.html` for details.
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./benchmark-report.tar.gz
        asset_name: benchmark-report.tar.gz
        asset_content_type: application/gzip

