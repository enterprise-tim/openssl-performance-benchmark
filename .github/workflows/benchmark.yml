---
name: OpenSSL Performance Benchmark

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      iterations: ${{ steps.set-matrix.outputs.iterations }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate version matrix with iterations
      id: set-matrix
      run: |
        echo "🔍 Reading OpenSSL versions and iteration config..."

        # Read iterations count (default to 3 if not specified)
        ITERATIONS=$(jq -r '.iterations // 3' config/versions.json)
        echo "iterations=$ITERATIONS" >> $GITHUB_OUTPUT
        echo "📊 Running $ITERATIONS iterations per version"

        # Generate matrix with version x iteration combinations
        # Output format: { "include": [{"version": "1.1.1w", "url": "...", "series": "...", "iteration": 1}, ...] }
        MATRIX_JSON=$(jq -c --argjson iters "$ITERATIONS" '
          {
            include: [
              .versions[] as $v |
              range(1; $iters + 1) |
              $v + {iteration: .}
            ]
          }
        ' config/versions.json)

        echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
        echo "🎯 Generated matrix with $(echo $MATRIX_JSON | jq '.include | length') total jobs"
        echo "$MATRIX_JSON" | jq '.'

  benchmark:
    runs-on: ubuntu-latest-4-cores
    needs: generate-matrix
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Benchmark Image
      run: |
        echo "📦 Building image for OpenSSL ${{ matrix.version }}"
        echo "   Iteration ${{ matrix.iteration }}/${{ needs.generate-matrix.outputs.iterations }}"
        docker build -t openssl-bench:${{ matrix.version }}-iter${{ matrix.iteration }} \
          --build-arg OPENSSL_VERSION=${{ matrix.version }} \
          --build-arg OPENSSL_URL=${{ matrix.url }} \
          -f docker/Dockerfile .

    - name: Run Benchmark (Iteration ${{ matrix.iteration }})
      id: run_bench
      run: |
        echo "🏃 Running benchmark iteration ${{ matrix.iteration }} for OpenSSL ${{ matrix.version }}..."
        mkdir -p results

        # Run docker and capture output (fresh container each time)
        OUTPUT=$(docker run --rm openssl-bench:${{ matrix.version }}-iter${{ matrix.iteration }})

        # Save output to file with iteration number
        RESULT_FILE="results/result-${{ matrix.version }}-iter${{ matrix.iteration }}.json"
        echo "$OUTPUT" > "$RESULT_FILE"

        # Validate JSON
        if jq -e . "$RESULT_FILE" >/dev/null 2>&1; then
          echo "✅ JSON result is valid"
        else
          echo "❌ Invalid JSON output:"
          echo "$OUTPUT"
          exit 1
        fi

        # Add metadata including iteration number
        TMP_FILE=$(mktemp)
        jq --argjson config '${{ toJson(matrix) }}' \
           --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
           --argjson iteration '${{ matrix.iteration }}' \
           '.config = $config | .timestamp = $timestamp | .iteration = $iteration' \
           "$RESULT_FILE" > "$TMP_FILE"
        mv "$TMP_FILE" "$RESULT_FILE"

        echo "✅ Saved results for ${{ matrix.version }} iteration ${{ matrix.iteration }}"

    - name: Upload Benchmark Result
      uses: actions/upload-artifact@v4
      with:
        name: result-${{ matrix.version }}-iter${{ matrix.iteration }}
        path: results/result-${{ matrix.version }}-iter${{ matrix.iteration }}.json
        retention-days: 7

  report:
    runs-on: ubuntu-latest
    needs: [benchmark, generate-matrix]
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download All Results
      uses: actions/download-artifact@v4
      with:
        path: downloaded-results
        pattern: result-*
        merge-multiple: true

    - name: Aggregate Results with Statistics
      run: |
        echo "📊 Aggregating results from multiple iterations..."
        echo "   Total result files: $(ls downloaded-results/result-*.json 2>/dev/null | wc -l)"
        echo "   Iterations per version: ${{ needs.generate-matrix.outputs.iterations }}"

        # Use our aggregation script to compute mean and stddev
        node scripts/aggregate-results.js downloaded-results results

        echo ""
        echo "✅ Statistical aggregation complete"
        echo "📄 Summary file:"
        ls -lh results/summary.json
        echo ""
        echo "📊 Preview of aggregated data:"
        jq -r '.[] | "\(.config.version): \(.config.iterations_count) iterations"' results/summary.json

    - name: Generate Reports
      run: |
        echo "📊 Generating Markdown Report..."
        npm run generate-report

        echo "📈 Generating Visualizations..."
        npm run generate-viz

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release-pack
        cp results/REPORT.md release-pack/
        cp results/summary.json release-pack/

        # Copy all generated HTML files (multi-page visualization)
        cp results/*.html release-pack/ 2>/dev/null || echo "No HTML files found"

        # Also copy detailed iterations if present
        cp results/detailed-iterations.json release-pack/ 2>/dev/null || echo "No detailed iterations"

        # Create a compressed archive
        tar -czf benchmark-report.tar.gz -C release-pack .

    - name: Upload Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: release-pack/

    - name: Create Release
      id: create_release
      if: github.ref == 'refs/heads/main'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: benchmark-${{ github.run_id }}
        release_name: "Benchmark Run ${{ github.run_id }}"
        body: |
          Automated benchmark run.

          See attached `REPORT.md` and `visualizations.html` for details.
        draft: false
        prerelease: false

    - name: Upload Release Asset
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./benchmark-report.tar.gz
        asset_name: benchmark-report.tar.gz
        asset_content_type: application/gzip

  deploy-pages:
    runs-on: ubuntu-latest
    needs: report
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Report Artifacts
      uses: actions/download-artifact@v4
      with:
        name: benchmark-report
        path: ./gh-pages

    - name: Create GitHub Pages structure
      run: |
        echo "📄 Setting up GitHub Pages structure..."
        cd gh-pages

        # The multipage generator creates index.html, but verify it exists
        if [ ! -f index.html ]; then
          echo "⚠️  Warning: index.html not found! The multipage generator should create it."
          echo "📋 Creating fallback index.html..."
          cat > index.html << 'EOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0; url=overview.html">
            <title>OpenSSL Performance Benchmark - Redirecting...</title>
            <style>
                body {
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    padding: 40px;
                    text-align: center;
                }
                h1 { color: #333; }
                p { color: #666; }
                a { color: #228be6; }
            </style>
        </head>
        <body>
            <h1>OpenSSL Performance Benchmark</h1>
            <p>Redirecting to dashboard...</p>
            <p>If you are not redirected, <a href="overview.html">click here</a>.</p>
        </body>
        </html>
        EOF
        else
          echo "✅ index.html exists (created by multipage generator)"
        fi

        echo ""
        echo "📁 GitHub Pages content:"
        ls -la
        echo ""
        echo "📊 HTML files:"
        ls -1 *.html 2>/dev/null || echo "No HTML files found!"

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./gh-pages

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
